[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finmamba3"
version = "0.1.0"
description = "Regime-modulated Mamba world model for Polymarket binary limit-order-books."
requires-python = ">=3.10"
dependencies = [
    "setuptools==69.5.1",
    "packaging>=24.0",
    "ninja>=1.11",
    "PyYAML>=6.0",
    "einops==0.8.0",
    "tqdm==4.66.4",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "pyarrow>=15.0",
    "gymnasium>=1.0,<2",
    "wandb",
    "pytorch_warmup==0.1.1",
]

# The CUDA-built packages (torch, mamba_ssm, causal_conv1d, tilelang) are intentionally
# omitted: they are provided by the environment (Colab) and the prebuilt WHEELS_REPO flow.

[project.scripts]
finmamba3-train = "finmamba3.train:main"
finmamba3-backtest = "finmamba3.eval.pnl_backtest:main"

# The native C++ backtester is opt-in. Install the build dependency with
# `pip install -e .[cpp]`, then build it once: `python -m finmamba3.backtester.engine_cpp.build`.
# The build is intentionally kept out of `pip install` so the package installs
# with no compiler (see backtester/engine_cpp/build.py).
[project.optional-dependencies]
cpp = ["pybind11>=2.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Collect only the test suite; without this, pytest recurses into runs/ and
# saved_models/ and chokes on wandb symlink directories left by training runs.
testpaths = ["tests"]
