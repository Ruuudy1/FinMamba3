BasicSettings:
  ObsMode: features
  FeatureDim: 100         # K(10) * F_level(8) + F_tick(20: 14 base + 6 binary-market)
  ReplayBufferOnGPU: True
  Seed: 3710
  Env_name: LOB
  Device: cuda:0
  Use_amp: True
  NormClip: 8.0
  Use_cg: False           # disables CUDA-graph caching in the Mamba decoding path
  Compile: False          # The batch-64 config is fast without it; torch.compile only adds startup here.
  SavePath: None

Evaluate:
  EpisodeNum: 10
  NumEnvs: 1
  DuringTraining: False
  EverySteps: 1000

JointTrainAgent:
  SampleMaxSteps: 1500    # Drives both the loop length and the cosine LR horizon (world_model.py t_max). At batch 1024 x length 64 each step samples ~18x the 3600-tick single-market buffer, so the proven val-368 baseline's total data exposure is reached by ~940 steps; 1500 is ~1.8x that for margin while keeping the run ~3.7h on the A100.
  EarlyStoppingPatience: 5
  EarlyStopMetric: Val/reconstruction_loss   # Reconstruction is the always-finite early-stop proxy. The thesis-relevant decision metrics (dir_acc, yes_log_loss) are echoed to stdout every validation and logged to wandb; the generalization claim is measured post-hoc on the saved checkpoints by eval/regime_split.py.
  SaveBestOnly: true
  BufferMaxLength: 50000
  MarketCount: 8       # Top-N longest markets for the multi-market substrate (generalization A/B). 1 = single-market legacy behavior. Multi-market val is a NEW baseline, not comparable to the 363/368 single-market numbers. BufferMaxLength above already has headroom for ~8 markets.
  WorldModelWarmUp: 64
  BehaviourWarmUp: 1000000   # effectively disables agent training
  NumEnvs: 1
  BatchSize: 1024      # A100 max-util recipe: the MIMO scan kernel's parallel grid is ~batch*heads*chunks, so a large batch is the dominant lever for SM occupancy. At the val-368 batch 128 the A100 sat at ~0-1% util / 2.2GB; this floods the card. NOTE: this is a NEW recipe, not the val-368 comparison.
  AccumSteps: 1        # Single fused forward/backward at the full batch; gradient accumulation would not raise occupancy.
  BatchLength: 64
  ImagineBatchSize: 64
  ImagineContextLength: 8
  ImagineBatchLength: 16
  RealityContextLength: 16
  TrainDynamicsEverySteps: 1
  TrainDynamicsEpoch: 1
  TrainAgentEverySteps: 1
  FreezeWorldModelAfterSteps: 20000
  FreezeBehaviourAfterSteps: 0
  SaveEverySteps: 1000    # Also drives val_every=max(SaveEverySteps//2,500) and imagine_every (train.py). 1000 hits the 500-step floor so the 1500-step run validates at 500/1000/1500; the fine per-step loss curve is covered by the LogEvery [loss] stdout print.
  LogEvery: 50         # World-model losses sync to CPU and log every N steps; avoids a per-step GPU stall.
  SaveModels: True
  Tau: 10
  ImaginationTau: 10
  Alpha: 1.0
  Beta: 1.0

Models:
  WorldModel:
    dtype: float32
    Backbone: Mamba3
    Act: SiLU
    # DreamerV3 (Hafner et al. 2023) uses 32x32 = 1024 across every domain. We
    # shrink to 16x16 = 256 because the LOB-aggregate input is only 94 dims:
    # 32x32 latent is a 10x EXPANSION over the input and stops acting as a
    # bottleneck. 16x16 is still 2.7x expansion, preserving capacity while
    # restoring some regularization pressure. Revert to 32 if reconstruction
    # collapses or KL stays pinned at the free-bits floor.
    CategoricalDim: 32
    ClassDim: 32
    HiddenStateDim: 1024
    Optimiser: Laprop
    LatentDiscreteType: naive
    Max_grad_norm: 100     # DreamerV3 default; loose by design for cross-domain robustness.
    Warmup_steps: 100      # Linear LR ramp; this is a FIXED step count independent of SampleMaxSteps (world_model.py LinearWarmup). At 1000 it would eat 67% of the 1500-step run and the LR would never reach peak; 100 is ~6.7%, matching the ratio the 15k run used.
    LRSchedule: cosine      # 'constant' or 'cosine' (decays to LRMin over SampleMaxSteps after warmup).
    LRMinRatio: 0.1         # Cosine floor as a fraction of the peak LR.
    UseActionInput: True    # Phase A populates action=0; set False to drop the dead one-hot path.
    DirectionThresholds: null   # Set to e.g. [0.0001, 0.001, 0.005, 0.01] for a multi-threshold sweep.
    Dropout: 0.1
    Unimix_ratio: 0.01
    Weight_decay: 1.0e-4
    RepresentationLossWeight: 0.1   # Beta on the representation-side KL term in the split KL.
    FreeBits: 1.0                   # Per-step KL floor in nats; KL is clipped to zero below this.
    Adam:
      LearningRate: 1.0e-4
    Laprop:
      LearningRate: 3.0e-4   # The local 4080 sweep found 3e-4 the clear optimum (recon 100 at 3e-4 vs 119 at 1.5e-4 vs 191 at 4e-5), monotonic and stable. The prior 1.1e-4 (sqrt-scaled off a 4e-5 anchor) sat in the under-performing region. 3e-4 is conservative at batch 1024 since a larger batch tolerates a higher LR; the sqrt-scaled aggressive option is ~8.5e-4.
      Epsilon: 1.0e-20
    Encoder:
      Type: lob
      K: 10
      FeatureDimLevel: 8
      FeatureDimTick: 20
      BinaryMarketFeatures: True   # Append boundary/logit/Amihud/variance-ratio tick features (Polymarket only).
      DModel: 256
      NumLayers: 2
      NumHeads: 4
      DimFeedforward: 512
      OutputFlattenDim: 2048
      AggregateOnly: False
      GradientCheckpointing: False   # Trade ~10% recompute for ~30% transformer activation memory if T4 OOMs.
    Decoder:
      Kind: mse              # 'mse' for Gaussian, 'studentt' for heavy-tailed log-likelihood.
      HiddenDim: 1024
      NumLayers: 3
      NuInit: 5.0            # Student-t degrees of freedom; ignored for 'mse'.
      LearnableNu: True
      SizeWeight: 2.0        # Multiplier on size-feature reconstruction MSE in the decoder loss.
    Reward:
      Enabled: false        # Phase A pretraining has no reward signal; gate the head off.
      HiddenUnits: 256
      LayerNum: 1
    Termination:
      Enabled: false        # Phase A has no episode boundaries; gate the head off.
      HiddenUnits: 256
      LayerNum: 1
    Transformer:
      FinalFeatureWidth: 4
      NumLayers: 2
      NumHeads: 8
    Mamba:
      n_layer: 2
      d_intermediate: 0
      ssm_cfg:
        d_state: 16
    Mamba3:
      Enabled: true
      n_layer: 6              # 2 was Drama-Atari default; A100 max-util recipe uses 6 for
                              # more depth/capacity and more total GPU work per step.
                              # Activation checkpointing on the encoder is available if VRAM is tight.
      is_mimo: false
      mimo_rank: 4            # The MIMO kernel's dynamic SMEM scales with chunk_size*mimo_rank.
                              # rank 4 needs ~120 KB at chunk_size=8 (fits A100's ~166 KB) and
                              # ~219 KB at chunk_size=16 (fits H100's ~227 KB). rank 8 needs ~217 KB
                              # at chunk_size=8 (over the A100 cap) and would not fit any target
                              # card at chunk_size=16 -- so 4 is the SMEM ceiling, not a tuning knob.
      d_state: 128            # Mamba-3 paper (arXiv:2603.15569) shows d_state=64 matches
                              # Mamba-2 d_state=128 at the same perplexity; 128 is over-
                              # provisioned but kept until empirical validation. Full
                              # d_state=128 MIMO should run on H100/H200/B200 for the
                              # headline comparison; A100 fits only the chunk_size=8
                              # compatibility path and was ~39.5h/15k steps in practice.
      headdim: 64
      chunk_size: 16          # MIMO default; the notebook floors this at 8 (the kernel
                              # minimum) on non-H100 GPUs to fit their shared memory.
      is_outproj_norm: false
      rope_fraction: 0.5
    Direction:
      Enabled: True           # Auxiliary 3-class direction loss; cheap predictive signal.
      NumClasses: 3           # 0=down, 1=flat, 2=up.
      Threshold: 0.01         # Normalized-mid delta below this is bucketed as 'flat'.
      LossWeight: 0.5         # Relative to reconstruction.
      Dropout: 0.0
    Regime:
      Enabled: False
      NumRegimes: 8
      EmbedDim: 32
    RegimeFiLM:
      Enabled: False          # In-scan FiLM modulation of the Mamba selection mechanism. Treatment arm sets True.
      NumRegimes: 8
      EmbedDim: 32
      EntropyCoef: 0.01       # Load-balance weight; spreads usage across regimes to prevent collapse.
    EpisodicMemory:
      Enabled: False                # Default off; baseline run for the A/B.
      Capacity: 50000               # Number of past hidden states retained on CPU.
      TopK: 4                       # Nearest neighbours fused per query.
      MinFillBeforeRetrieve: 1024   # Skip retrieval until the buffer has this many entries.
      RetrieveEvery: 4              # CPU retrieval throttle (every N training steps).
      UseNovelty: False             # When True, only writes whose KL novelty exceeds NoveltyThreshold are kept.
      NoveltyThreshold: 0.0
    Hawkes:
      Enabled: False                # Auxiliary Poisson NLL on buy/sell event counts; needs event_counts data.
      LossWeight: 0.1
    Settlement:
      Enabled: True
      LossWeight: 0.5               # Polymarket binary-outcome calibration is the primary objective; weight matches direction loss.

  Agent:
    dtype: float32
    Policy: AC
    Unimix_ratio: 0
    AC:
      NumLayers: 3
      Gamma: 0.985
      Lambda: 0.95
      EntropyCoef: 3.e-4
      Max_grad_norm: 100
      Warmup_steps: 1000
      Act: SiLU
      Optimiser: Laprop
      Adam:
        LearningRate: 3.0e-5
        Epsilon: 1.0e-5
      Laprop:
        LearningRate: 4.0e-5
        Epsilon: 1.0e-20
      Actor:
        HiddenUnits: 256
      Critic:
        HiddenUnits: 512
    PPO:
      NumLayers: 3
      Gamma: 0.985
      Lambda: 0.95
      EpsilonClip: 0.2
      K_epochs: 3
      Minibatch: 16384
      CriticCoef: 1
      EntropyCoef: 3.e-4
      KL_threshold: 0.01
      Max_grad_norm: 100
      Warmup_steps: 1000
      Act: SiLU
      Optimiser: Laprop
      Adam:
        LearningRate: 3.e-5
        Epsilon: 1.0e-5
      Laprop:
        LearningRate: 4.0e-5
        Epsilon: 1.0e-20
      Actor:
        HiddenUnits: 256
      Critic:
        HiddenUnits: 512

Wandb:
  Init:
    Mode: offline
    Project: Drama_LOB_pretrain
n: lob
